name: Java Selenium Tests

on:
  push:
    branches: ["master", "Jsel"]
  pull_request:
    branches: ["Jsel"]

jobs:
  tests:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Tests
      run: mvn clean test

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with: 
       name: test-results
       path: target/reports
       
   - name: Deploy to Github Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
       publish_dir: ./public
